name: Sync film posters
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_all:
        description: Recheck even unchanged source URLs
        type: boolean
        default: false
  schedule:
    - cron: '17 19 * * *'

permissions:
  contents: write

concurrency:
  group: filmstock-poster-sync
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Sync posters
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          REFRESH_ALL: ${{ inputs.refresh_all }}
        run: npx --no-install tsx scripts/sync-posters.ts
      - name: Commit changed posters
        id: commit
        run: |
          git add -- lib/movies/poster-manifest.json public/posters
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync optimized movie posters'
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Optional Vercel deploy hook
        if: steps.commit.outputs.changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --max-time 30 -X POST "$VERCEL_DEPLOY_HOOK" >/dev/null
          fi
